<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="RoadSpace — driver-focused racing telemetry analysis and visualization software. In development.">
  <title>RoadSpace — Understand your driving. Find your time.</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101010; color: #e5e5e5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .page { max-width: 1140px; margin: 0 auto; padding: 0 22px; }
    header { min-height: 65px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { color: #efefef; text-decoration: none; font-size: 16px; font-weight: 500; letter-spacing: -0.02em; }
    nav { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    nav a { color: #bcbcbc; text-decoration: none; }
    nav a:hover, nav a:focus-visible { color: #fff; text-decoration: underline; }
    nav span { color: #777; }
    main { padding-top: 36px; padding-bottom: 64px; }
    h1 { font-size: clamp(23px, 3vw, 26px); font-weight: 600; line-height: 1.35; letter-spacing: -0.035em; margin: 0 0 12px; }
    .intro { font-size: 16px; line-height: 1.62; margin: 0 0 14px; max-width: 710px; color: #d0d0d0; }
    .button { display: inline-block; background: #242424; border: 1px solid transparent; border-radius: 8px; color: #efefef; text-decoration: none; padding: 12px 17px; font-size: 14px; font-weight: 500; transition: background .15s ease; }
    .button:hover, .button:focus-visible { background: #343434; }
    .status { margin: 12px 0 0; color: #bdbdbd; font-size: 14px; line-height: 1.6; }
    @media (max-width: 480px) { .page { padding: 0 18px; } header { min-height: 62px; } main { padding-top: 32px; } .intro { font-size: 15px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="RoadSpace home">ROADSPACE</a>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:hello@roadspace.example">Contact</a>
      </nav>
    </header>
    <main id="about">
      <h1>Understand your driving. Find your time.</h1>
      <p class="intro">A new way to explore racing telemetry, understand your performance, and discover where you're leaving time on the track.</p>
      <a class="button" href="mailto:hello@roadspace.example?subject=RoadSpace%20pilot%20waitlist">Join the pilot waitlist</a>
      <p class="status">Driver-focused telemetry analysis. In development.</p>
    </main>
  </div>
</body>
</html>
